<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechtstrainer</title>
<meta name="description" content="Multiple-Choice-Training für Gesetzestexte">
<meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechtstrainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F3F6FB; --card:#ffffff; --ink:#14213D; --mute:#56627D; --line:#DCE4F1;
  --acc:#2457D6; --on:#ffffff; --soft:#E4ECFF;
  --ok:#0B7A55; --ok-bg:#E3F5EC; --bad:#C0362C; --bad-bg:#FDEAE7; --warn:#9A5B00; --warn-bg:#FFF2DB;
  --c1:#2457D6; --c2:#0E8A7D; --c3:#B7791F; --c4:#7A4FD1; --c5:#C2410C;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1626; --card:#162036; --ink:#E8EEFC; --mute:#9AA8C7; --line:#263454;
    --acc:#7AA2FF; --on:#0B1530; --soft:#1E2D52;
    --ok:#4CC38A; --ok-bg:#123225; --bad:#FF8A80; --bad-bg:#3A1B1B; --warn:#F0B35A; --warn-bg:#33270F;
    --c1:#7AA2FF; --c2:#3CC9B8; --c3:#F0B35A; --c4:#B79BFF; --c5:#FF9A62;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h2:focus{outline:none}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 170px)}
h1{font-size:25px;letter-spacing:-.02em;margin:0}
p{margin:0}
.mute{color:var(--mute)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ibtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc);display:grid;place-items:center;padding:0}
.ibtn svg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pills{display:flex;gap:6px;margin:12px 0 2px;overflow-x:auto}
.pill{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 15px;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.pill[disabled]{opacity:.55;cursor:default}
.pill small{opacity:.75;font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.mini{display:flex;gap:6px}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0}
.search{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

/* Gruppen */
.grp{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:9px;overflow:hidden}
.grp.has{border-color:var(--cc)}
@supports (color:color-mix(in srgb,red 50%,blue)){.grp.has{border-color:color-mix(in srgb,var(--cc) 55%,var(--line))}}
.gh{display:flex;align-items:center;gap:6px;padding:0 6px 0 8px}
.gmain{flex:1;min-width:0;display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:13px 6px;cursor:pointer}
.tri{flex:none;width:30px;height:30px;margin-left:4px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--on);padding:0}
.tri.all{background:var(--cc);border-color:var(--cc)}
.tri.some{background:var(--soft);border-color:var(--cc);color:var(--ink)}
.gt{display:block;flex:1;min-width:0}
.gt b{display:flex;align-items:center;gap:7px;font-size:15px}
.gt b i{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.gt span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--line);color:var(--mute)}
.cnt.on{background:var(--soft);color:var(--ink)}
.chev{flex:none;width:18px;height:18px;transition:transform .18s;color:var(--mute)}
.grp.open .chev{transform:rotate(180deg)}
.gb{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:2px 11px 12px}
.grp.open .gb,.flat{display:grid}
.flat{grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px;min-width:0;--cc:var(--c1)}
.tile b{display:block;font-size:14.5px}
.tile .tt{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile .qn{display:block;font-size:11.5px;color:var(--mute);margin-top:3px}
.tile.sel{border-color:var(--cc);background:var(--soft)}
@supports (color:color-mix(in srgb,red 50%,blue)){.tile.sel{background:color-mix(in srgb,var(--cc) 14%,var(--card))}}
.tile.sel .qn{color:var(--ink)}
.tile .ck{position:absolute;top:8px;right:9px;width:17px;height:17px;border-radius:50%;background:var(--cc);color:var(--on);font-size:10px;font-weight:800;display:none;place-items:center}
.tile.sel .ck{display:grid}
label.chk{display:flex;gap:10px;align-items:center}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}

/* Stacks */
.stack{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.stack .sx{flex:1;min-width:120px}
.stack .sx b{display:block}
.stack small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{border:0;border-radius:10px;background:var(--soft);color:var(--acc);font-weight:700;font-size:13px;padding:7px 12px}
.sm.del{background:none;color:var(--bad);padding:7px 8px}
.sm.pri{background:var(--acc);color:var(--on)}
.sa{display:flex;gap:6px;flex:none}
.save{display:flex;gap:8px;margin-top:8px}
.save input,.linkrow input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.empty{color:var(--mute);padding:4px 0}
.note{color:var(--mute);font-size:12.5px;margin-top:20px}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:20}
.dock .in{max-width:640px;margin:0 auto}
.startbar{padding:10px 18px 8px;display:flex;gap:8px}
.btn{border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:700;font-size:15px;padding:13px;width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;border:0;background:none;font-size:11px;font-weight:600;color:var(--mute);display:grid;justify-items:center;gap:2px;padding:4px 0}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--acc)}
.actbar{padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;background:var(--bg);border-top:1px solid var(--line)}

/* Quiz */
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:600;gap:8px}
.bar{height:5px;border-radius:5px;background:var(--line);margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .25s}
.qbox{background:var(--soft);border:1.5px solid var(--acc);border-radius:18px;padding:14px 15px 13px;margin-bottom:14px}
.qbox .lab{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.qbox .lab b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on);font-size:13px;letter-spacing:0}
.qbox h2{font-size:18px;line-height:1.35;font-weight:700;margin:9px 0 8px;letter-spacing:-.005em}
.qbox .hint{font-size:12.5px;color:var(--mute)}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px;margin-bottom:9px}
.opt .bx{flex:none;width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;margin-top:1px;color:var(--on)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}
.opt[aria-pressed="true"] .bx{background:var(--acc);border-color:var(--acc)}
.opt .txt{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .bx{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .bx{background:var(--bad);border-color:var(--bad);color:var(--on)}
.opt.miss{border-color:var(--warn);background:var(--warn-bg)}
.opt.neutral{opacity:.92}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:7px;background:var(--line);color:var(--mute)}
.ok .tag{background:var(--ok);color:var(--on)} .bad .tag{background:var(--bad);color:var(--on)} .miss .tag{background:var(--warn);color:var(--on)}
.why{display:block;margin-top:7px;font-size:13.5px;color:var(--ink)}
.score{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:4px 0 8px}
.score b{font-size:28px;letter-spacing:-.02em;color:var(--acc)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
pre.law{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-serif,Georgia,serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 0}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}

/* Auswertung / Statistik */
.ring{display:grid;place-items:center;margin:10px auto 2px;width:160px;height:160px}
.row{display:grid;grid-template-columns:1fr 46px;gap:2px 10px;align-items:center;margin:11px 0;font-size:13.5px;font-weight:600}
.row .t{grid-column:1/-1}
.track{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--cc,var(--acc))}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--mute)}

/* Teilen-Blatt */
.dim{position:fixed;inset:0;background:rgba(8,14,28,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);max-height:92%;overflow-y:auto}
.sheet .in{max-width:640px;margin:0 auto;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh h2{font-size:19px;margin:0}
.sh p{font-size:13px;color:var(--mute);margin-top:2px}
.xbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--line);font-size:16px;line-height:1;padding:0}
.linkrow{display:flex;gap:8px;margin:14px 0 10px}
.cp{flex:none;border:0;border-radius:10px;background:var(--soft);color:var(--acc);font-weight:700;font-size:13px;padding:0 14px}
.cp.done{background:var(--ok-bg);color:var(--ok)}
.stack2{display:grid;gap:8px}
.tip{display:flex;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--mute);margin-top:12px}
.tip b{color:var(--ink)}
.qr{display:grid;justify-items:center;gap:8px;margin-top:12px;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.qr svg{width:210px;height:210px;display:block}
.qr span{font-size:12px;color:#44506b}
.with{display:flex;gap:10px;align-items:center;margin:2px 0 10px;font-size:14px}
/* Verweise, Einstellungen, Easter Egg */
.ref{color:var(--acc);font-weight:600;text-decoration:underline dashed;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
.opt.ok,.opt.bad,.opt.miss,.opt.neutral{cursor:default}
.dim.clear{background:transparent}
.pop{position:fixed;left:14px;right:14px;max-width:440px;margin:0 auto;z-index:42;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(10,20,50,.3);padding:14px 14px 12px}
.pop h3{margin:7px 0 4px;font-size:16px}
.pop p{margin:0 0 10px;font-size:14px}
.ptag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--acc)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prow a{color:var(--acc);font-weight:600;font-size:13.5px}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:42;width:min(310px,88vw);background:var(--card);border-radius:20px;padding:22px 18px 16px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.dlg .em{font-size:44px;line-height:1;margin-bottom:6px}
.dlg h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.dlg p{margin:0 0 16px;color:var(--mute)}
.grow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border:0}
.badge{flex:none;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--acc);font-weight:800;display:grid;place-items:center}
.gn{flex:1}
.pct{display:flex;align-items:center;gap:6px}
.pct input{width:76px;font:inherit;font-size:16px;text-align:right;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.gerr{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 4px;font-weight:600}
.gnote{flex:none;font-weight:800;border-radius:10px;padding:5px 10px;background:var(--soft);color:var(--acc);font-size:13px}
.gnote.n1{background:var(--ok-bg);color:var(--ok)}
.gnote.n5{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock"></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<script src="vendor/qrcode.js"></script>
<script>
"use strict";
/* ================= Helfer ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); if(v == null) return d; const x = JSON.parse(v);
    if(Array.isArray(d)) return Array.isArray(x) ? x : d;
    return (x !== null && typeof x === typeof d) ? x : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ if(!store._warned){ store._warned = true; setTimeout(() => toast('Speichern nicht möglich (privater Modus?). Dein Fortschritt geht beim Schließen verloren.'), 300); } return false; } }
};
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
const punkte = n => n + (n===1 ? ' Punkt' : ' Punkte');
const IC = {
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>'
};

/* ================= Gesetze & Daten ================= */
const LAWS = [
  {id:'BDG',  name:'BDG',  full:'Beamten-Dienstrechtsgesetz 1979', file:'daten/bdg.json', ready:true},
  {id:'StGB', name:'StGB', full:'Strafgesetzbuch',                  ready:false},
  {id:'SPG',  name:'SPG',  full:'Sicherheitspolizeigesetz',         ready:false},
  {id:'VStG', name:'VStG', full:'Verwaltungsstrafgesetz',           ready:false}
];
const GROUP_MIN = 10;      // ab so vielen Paragrafen werden Gruppen-Kästen verwendet
const SEARCH_MIN = 30;     // ab so vielen Paragrafen erscheint ein Suchfeld
const SHARE_TEXT = 'Rechtstrainer: Multiple-Choice-Training für Gesetzestexte. Link in Safari öffnen, dann Teilen › Zum Home-Bildschirm.';
const NOTEN = ['Sehr gut','Gut','Befriedigend','Genügend','Nicht genügend'];
const DEF_GRADES = [87.5, 75, 62.5, 50];   // Notenschlüssel: Mindestprozent für Note 1 bis 4, darunter Note 5
const cache = {};
let REFS = [], REFRE = null;
async function loadRefs(){
  try{
    const r = await fetch('daten/verweise.json'); if(!r.ok) return;
    const j = await r.json();
    REFS = (j.refs || []).filter(x => x && typeof x.match === 'string' && x.match && !x.pruefen && typeof x.text === 'string' && x.text);
    REFRE = REFS.length ? new RegExp(REFS.map(x => esc(x.match)).sort((a,b) => b.length-a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g') : null;
  }catch(e){ REFS = []; REFRE = null; }
}
/* Verweise in (bereits maskiertem) Text strichliert unterstreichen und antippbar machen */
function linkRefs(h){
  if(!REFRE) return h;
  return h.replace(REFRE, m => { const i = REFS.findIndex(x => esc(x.match) === m); return i < 0 ? m : `<span class="ref" role="button" tabindex="0" data-act="ref" data-r="${i}">${m}</span>`; });
}
async function loadLaw(id){
  if(cache[id]) return cache[id];
  const law = LAWS.find(l => l.id === id);
  const r = await fetch(law.file);
  if(!r.ok) throw new Error('Daten nicht ladbar');
  cache[id] = await r.json();
  return cache[id];
}
function groupsOf(d){
  if(d.gruppen && d.gruppen.length) return d.gruppen.map(g => ({name:g.name, ps:g.paras.map(n => d.paragrafen.find(p => p.n===n)).filter(Boolean)}));
  return [{name:d.name, ps:d.paragrafen}];
}

/* ================= Zustand ================= */
const S = {view:'home', law:(() => { const l = store.get('rt.law','BDG'); return LAWS.some(x => x.id === l && x.ready) ? l : 'BDG'; })(), data:null, sel:new Set(), open:new Set(), onlyOpen:store.get('rt.onlyOpen',false), q:'', run:null, sheet:null, histAll:false};
const hist   = () => store.get('rt.hist2', {});
const stacks = () => store.get('rt.stacks', []).filter(s => s && typeof s.id === 'string' && typeof s.name === 'string' && Array.isArray(s.paras));
const flags  = () => store.get('rt.flags', []);
const klausuren = () => store.get('rt.klausur', []).filter(x => x && typeof x.pts === 'number' && typeof x.mx === 'number' && typeof x.name === 'string');
function grades(){ const g = store.get('rt.grades', DEF_GRADES); return (g.length === 4 && g.every((x,i) => typeof x === 'number' && isFinite(x) && x > 0 && x <= 100 && (i === 0 || x < g[i-1]))) ? g : DEF_GRADES; }
function noteOf(p, m, g){ for(let i=0;i<4;i++){ if(p*100 >= g[i]*m - 1e-9) return i+1; } return 5; }
const fmtNum = x => String(x).replace('.', ',');
const datum = t => { try{ return new Date(t).toLocaleString('de-AT', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); }catch(e){ return ''; } };
const order  = () => S.data.paragrafen.map(p => p.n);
const persistSel = () => { store.set('rt.sel.'+S.law, order().filter(n => S.sel.has(n))); };
const persistOpen = () => store.set('rt.open.'+S.law, [...S.open]);

/* Punktesystem: je Aussage +1 (richtig angekreuzt oder richtig ausgelassen), −1 (falsch angekreuzt oder falsch ausgelassen). Minimum 0, Maximum 4. */
function score(q, ticked){ let p=0; q.s.forEach((x,i) => { p += (ticked.has(i) === x.w) ? 1 : -1; }); return Math.max(0, p); }
const isOpen = (q, H) => { const h = (H || hist())[q.id]; return !h || h.last < 4; };
function buildPool(){
  const qs = [];
  S.data.paragrafen.forEach(p => { if(S.sel.has(p.n)) p.q.forEach(q => qs.push({q, p})); });
  const H = hist();
  return S.onlyOpen ? qs.filter(x => isOpen(x.q, H)) : qs;
}
const countQ = ns => S.data.paragrafen.filter(p => ns.includes(p.n)).reduce((a,p) => a + p.q.length, 0);

/* ================= Darstellung ================= */
function setDock(html){ $('#dock').innerHTML = html ? `<div class="in">${html}</div>` : ''; }
function tabbar(){
  const t = (id, label, icon) => `<button data-act="tab" data-v="${id}" class="${S.view===id?'on':''}" ${S.view===id?'aria-current="page"':''}>${icon}${label}</button>`;
  return `<nav class="tabbar" aria-label="Hauptnavigation">${t('home','Lernen',IC.book)}${t('stacks','Klausuren',IC.layers)}${t('stats','Statistik',IC.chart)}</nav>`;
}
function render(keep){
  const y = keep ? window.scrollY : 0;
  ({home:renderHome, stacks:renderStacks, stats:renderStats, quiz:renderQ, result:renderResult})[S.view]();
  window.scrollTo(0, y);
}
function header(sub){
  return `<div class="top"><h1>Rechtstrainer</h1><div style="display:flex;gap:8px"><button class="ibtn" data-act="settings" aria-label="Einstellungen">${IC.gear}</button><button class="ibtn" data-act="share" aria-label="App teilen">${IC.share}</button></div></div>
    <p class="mute" style="margin-top:2px">${sub}</p>`;
}
function lawPills(){
  return '<div class="pills">' + LAWS.map(l => `<button class="pill ${l.id===S.law?'on':''}" data-act="law" data-id="${l.id}" ${l.ready?'':'disabled'}>${l.name}${l.ready?'':' <small>bald</small>'}</button>`).join('') + '</div>';
}

/* ---------- Lernen (Start) ---------- */
function tile(p, cc){
  const on = S.sel.has(p.n);
  return `<button class="tile ${on?'sel':''}" data-act="tog" data-p="${esc(p.n)}" style="--cc:var(${cc})" aria-pressed="${on}"><span class="ck">✓</span><b>${esc(p.label)}</b><span class="tt">${esc(p.title)}</span><span class="qn">${p.q.length} Fragen</span></button>`;
}
function renderHome(){
  const d = S.data, groups = groupsOf(d), total = d.paragrafen.reduce((a,p)=>a+p.q.length,0), h = hist();
  const done = d.paragrafen.reduce((a,p)=>a+p.q.filter(q=>h[q.id]&&h[q.id].last>=4).length,0);
  const useGroups = d.paragrafen.length >= GROUP_MIN;
  const filt = S.q.trim().toLowerCase();
  const match = p => !filt || (p.label+' '+p.title).toLowerCase().includes(filt);
  let list;
  if(useGroups){
    list = groups.map((g,gi) => {
      const ps = g.ps, n = ps.filter(p=>S.sel.has(p.n)).length, shown = ps.filter(match);
      if(filt && !shown.length) return '';
      const open = !!filt || S.open.has(gi);
      const cls = n===0 ? '' : (n===ps.length ? 'all' : 'some'), mark = cls==='all' ? '✓' : (cls==='some' ? '–' : '');
      const cc = '--c'+((gi%5)+1);
      return `<div class="grp ${open?'open':''} ${n?'has':''}" style="--cc:var(${cc})">
        <div class="gh">
          <button class="tri ${cls}" data-act="grpall" data-g="${gi}" aria-label="Alle Paragrafen von ${esc(g.name)} wählen oder abwählen">${mark}</button>
          <button class="gmain" aria-expanded="${open}" data-act="grp" data-g="${gi}"><span class="gt"><b><i></i>${esc(g.name)}</b><span>${open ? ps.length+' Paragrafen' : esc(ps.map(p=>p.label).join(', '))}</span></span><span class="cnt ${n?'on':''}">${n} / ${ps.length}</span>${IC.chev}</button></div>
        <div class="gb">${shown.map(p => tile(p, cc)).join('')}</div></div>`;
    }).join('');
  } else {
    list = `<div class="flat">${d.paragrafen.filter(match).map(p => tile(p, '--c1')).join('')}</div>`;
  }
  const pool = buildPool();
  $('#app').innerHTML = `${header(esc(d.name)+' · '+total+' Fragen · '+done+' sicher')}
    ${lawPills()}
    <div class="sec"><span>Paragrafen · ${S.sel.size} gewählt</span><span class="mini"><button data-act="all">Alle</button><button data-act="none">Keine</button></span></div>
    ${d.paragrafen.length > SEARCH_MIN ? `<input class="search" id="q" type="search" placeholder="Paragraf oder Stichwort suchen …" value="${esc(S.q)}" aria-label="Paragrafen suchen">` : ''}
    ${list || '<p class="empty">Keine Treffer.</p>'}
    <div class="sec"><span>Optionen</span></div>
    <div class="card"><label class="chk"><input type="checkbox" id="onlyOpen" ${S.onlyOpen?'checked':''}> Nur Fragen, die ich noch nicht sicher kann</label></div>
    <div class="sec"><span>Klausuren</span></div>
    <div id="stk">${stackList(false)}</div>
    ${stackSave()}
    <p class="note">Quelle der Gesetzestexte: ${esc(d.quelle)}, abgerufen am ${esc(d.abgerufen)}. Die Fragen wurden von einer KI aus dem Wortlaut erstellt und können Fehler enthalten. Im Zweifel gilt der Gesetzestext, der nach jeder Antwort angezeigt wird. Keine Rechtsberatung.</p>`;
  setDock(`<div class="startbar"><button class="btn" data-act="start" ${pool.length?'':'disabled'}>${pool.length ? 'Start · '+pool.length+' Fragen' : (S.sel.size ? 'Keine offenen Fragen' : 'Paragrafen wählen')}</button></div>${tabbar()}`);
  const q = $('#q'); if(q) q.oninput = e => { S.q = e.target.value; render(true); const n=$('#q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
  const oo = $('#onlyOpen'); if(oo) oo.onchange = e => { S.onlyOpen = e.target.checked; store.set('rt.onlyOpen', S.onlyOpen); render(true); };
}

/* ---------- Stacks ---------- */
function stackList(full){
  const list = stacks().filter(s => s.law === S.law);
  if(!list.length) return '<div class="card empty">Noch keine Klausuren gespeichert.</div>';
  return list.map(s => `<div class="stack"><div class="sx"><b>${esc(s.name)}</b><small>${esc(s.paras.map(n=>'§ '+n).join(', '))} · ${countQ(s.paras)} Fragen</small></div>
    <div class="sa"><button class="sm pri" data-act="stk-start" data-id="${esc(s.id)}">Start</button><button class="sm" data-act="stk-load" data-id="${esc(s.id)}">Laden</button>
    ${full ? `<button class="sm" data-act="stk-share" data-id="${esc(s.id)}" aria-label="Klausur teilen">Teilen</button>` : ''}
    ${full ? `<button class="sm del" data-act="stk-del" data-id="${esc(s.id)}" aria-label="Klausur löschen">✕</button>` : ''}</div></div>`).join('');
}
function stackSave(){
  return `<div class="save"><input id="sname" type="text" maxlength="40" placeholder="Name für die aktuelle Auswahl" aria-label="Name der Klausur"><button class="sm" data-act="stk-save" ${S.sel.size?'':'disabled'}>Speichern</button></div>`;
}
function renderStacks(){
  $('#app').innerHTML = `${header('Gespeicherte Klausuren')}
    <div class="sec"><span>Deine Klausuren · ${esc(S.law)}</span></div>
    <div id="stk">${stackList(true)}</div>
    <div class="sec"><span>Aktuelle Auswahl als Klausur speichern</span></div>
    <p class="mute" style="margin-bottom:8px">${S.sel.size ? S.sel.size+' Paragrafen · '+countQ([...S.sel])+' Fragen gewählt' : 'Wähle zuerst auf „Lernen“ Paragrafen aus.'}</p>
    ${stackSave()}
    <p class="note">Mit „Start“ legst du die gespeicherte Klausur los, das Ergebnis kommt in die Historie (Statistik). Mit „Teilen“ erzeugst du einen Link, der die Paragrafen der Klausur enthält. Wer ihn öffnet, startet mit derselben Auswahl. Dein Lernfortschritt wird nie mitgeschickt.</p>`;
  setDock(tabbar());
}
function saveStack(){
  const inp = $('#sname'); if(!S.sel.size) return;
  const list = stacks(), name = ((inp&&inp.value)||'').trim() || ('Klausur ' + (list.filter(s=>s.law===S.law).length+1));
  list.push({id:Date.now() + '-' + Math.random().toString(36).slice(2,6), name, law:S.law, paras:order().filter(n=>S.sel.has(n))});
  store.set('rt.stacks', list); toast('Klausur gespeichert'); render(true);
}

/* ---------- Statistik ---------- */
function renderStats(){
  const d = S.data, h = hist(), groups = groupsOf(d);
  const all = d.paragrafen.flatMap(p => p.q), ans = all.filter(q => h[q.id]);
  const pts = ans.reduce((a,q) => a + h[q.id].last, 0), safe = ans.filter(q => h[q.id].last >= 4).length;
  const pc = ans.length ? Math.round(pts/(4*ans.length)*100) : 0;
  const rows = groups.map((g,gi) => {
    const qs = g.ps.flatMap(p => p.q), a = qs.filter(q => h[q.id]), p = a.reduce((x,q)=>x+h[q.id].last,0);
    const quote = a.length ? Math.round(p/(4*a.length)*100) : 0;
    return `<div class="row" style="--cc:var(--c${(gi%5)+1})"><span class="t">${esc(g.name)} <span class="mute" style="font-weight:500">· ${a.length} von ${qs.length} beantwortet</span></span><div class="track"><i style="width:${quote}%"></i></div><span class="v">${a.length?quote+' %':'–'}</span></div>`;
  }).join('');
  const fl = flags(), kl = klausuren().filter(x => x.law === S.law), shown = S.histAll ? kl : kl.slice(0, 10);
  const histRows = kl.length
    ? shown.map(x => `<div class="stack"><div class="sx"><b>${esc(x.name)}</b><small>${esc(datum(x.t))} · ${x.pts} von ${x.mx} Punkten · ${x.pc} %</small></div><span class="gnote n${x.note}">Note ${x.note}</span></div>`).join('') + (kl.length > 10 ? `<button class="sm" data-act="hist-all">${S.histAll ? 'Weniger anzeigen' : 'Alle ' + kl.length + ' anzeigen'}</button>` : '')
    : '<div class="card empty">Noch keine Klausur abgeschlossen. Starte auf „Klausuren“ eine gespeicherte Klausur mit „Start“.</div>';
  $('#app').innerHTML = `${header('Dein Lernstand zu ' + esc(S.law))}
    <div class="kpis"><div class="kpi"><b>${ans.length}</b><span>beantwortet</span></div><div class="kpi"><b>${safe}</b><span>sicher (4 Punkte)</span></div><div class="kpi"><b>${ans.length?pc+' %':'–'}</b><span>Quote</span></div></div>
    <div class="sec"><span>Nach Themenfeld</span></div><div class="card">${rows}</div>
    <div class="sec"><span>Historie · Klausuren</span></div>${histRows}
    <div class="sec"><span>Weiteres</span></div>
    <div class="stack"><div class="sx"><b>Historie löschen</b><small>Entfernt alle gespeicherten Klausur-Ergebnisse</small></div><button class="sm del" data-act="hist-clear" ${kl.length?'':'disabled'}>Löschen</button></div>
    <div class="stack"><div class="sx"><b>Gemeldete Fragen</b><small>${fl.length} markiert</small></div><button class="sm" data-act="flags" ${fl.length?'':'disabled'}>Kopieren</button></div>
    <div class="stack"><div class="sx"><b>Fortschritt zurücksetzen</b><small>Löscht nur deine Ergebnisse auf diesem Gerät</small></div><button class="sm del" data-act="reset">Zurücksetzen</button></div>`;
  setDock(tabbar());
}

/* ---------- Quiz ---------- */
function startRun(pool, klausur){
  if(!pool.length) return;
  S.run = {items:shuffle(pool).map(x => ({q:x.q, p:x.p, order:shuffle([0,1,2,3])})), i:0, ticked:new Set(), checked:false, res:[], klausur:klausur || null, saved:false, egg:false};
  S.view = 'quiz'; render();
}
function renderQ(){
  const r = S.run, it = r.items[r.i], q = it.q, total = r.items.length;
  const fl = flags().includes(q.id), ticked = r.ticked;
  const last = r.res[r.res.length-1];
  let h = `<div class="meta"><span>Frage ${r.i+1} / ${total} · ${esc(it.p.label)}</span><span>${r.res.reduce((a,x)=>a+x.pts,0)} Punkte (max. ${total*4})</span></div>
    <div class="bar"><i style="width:${(r.i + (r.checked?1:0))/total*100}%"></i></div>
    <div class="qbox"><div class="lab"><b>?</b>Frage · ${esc(it.p.label)} ${esc(S.law)}</div><h2>${esc(q.f)}</h2><div class="hint">Kreuze alle zutreffenden Aussagen an. Pro Aussage: +1 Punkt, wenn richtig behandelt, sonst −1 (mindestens 0).</div></div>`;
  it.order.forEach(idx => {
    const s = q.s[idx], t = ticked.has(idx);
    let cls = '', tag = '', mark = t ? '✓' : '';
    if(r.checked){
      if(t && s.w){ cls='ok'; tag='Richtig angekreuzt'; }
      else if(t && !s.w){ cls='bad'; tag='Falsch angekreuzt'; mark='✕'; }
      else if(!t && s.w){ cls='miss'; tag='Übersehen: diese Aussage trifft zu'; }
      else { cls='neutral'; tag='Richtig ausgelassen'; }
    }
    h += `<button class="opt ${cls}" data-act="pick" data-i="${idx}" aria-pressed="${t}">
      <span class="bx">${mark}</span>
      <span class="txt">${linkRefs(esc(s.t))}${r.checked ? `<br><span class="tag">${tag}</span>${(!s.w && s.k) ? `<span class="why"><b>Erklärung:</b> ${esc(s.k)}</span>` : ''}` : ''}</span></button>`;
  });
  if(r.checked){
    h += `<div class="score"><b>${punkte(last.pts)}</b><span class="mute">von höchstens 4 in dieser Frage</span></div>
      <details open><summary>Gesetzestext ${esc(it.p.label)} ${esc(S.law)} · ${esc(q.ref)}</summary><pre class="law">${esc(it.p.title)}\n\n${esc(it.p.text)}</pre>
      <p class="note" style="margin-top:8px">Fassung in Kraft seit ${esc(it.p.stand)} · Quelle: RIS</p></details>
      <div style="margin-top:12px"><button class="sm flag" data-act="flag" aria-pressed="${fl}">⚑ Frage melden</button></div>`;
  }
  $('#app').innerHTML = h;
  setDock(`<div class="actbar">${r.checked
    ? `<button class="btn" data-act="next">${r.i+1<total ? 'Weiter' : 'Auswertung'}</button>`
    : `<button class="btn alt" data-act="quit" style="flex:1">Beenden</button><button class="btn" data-act="check" style="flex:2">Prüfen</button>`}</div>`);
  if(!r.checked){ const h2 = $('#app h2'); if(h2){ h2.setAttribute('tabindex','-1'); h2.focus({preventScroll:true}); } }
  else { const nx = $('[data-act="next"]'); if(nx) nx.focus({preventScroll:true}); }
}
function checkAnswer(){
  const r = S.run, it = r.items[r.i], p = score(it.q, r.ticked);
  r.res.push({id:it.q.id, n:it.p.n, label:it.p.label, pts:p});
  const H = hist(); const o = H[it.q.id] || {n:0}; H[it.q.id] = {last:p, n:o.n+1}; store.set('rt.hist2', H);
  r.checked = true; render();
}

/* ---------- Auswertung ---------- */
function renderResult(){
  const r = S.run, pts = r.res.reduce((a,x)=>a+x.pts,0), mx = r.res.length*4, pc = mx ? Math.round(pts/mx*100) : 0;
  const G = grades(), note = mx ? noteOf(pts, mx, G) : 5, complete = r.res.length === r.items.length;
  let saveMsg = '';
  if(r.klausur){
    if(complete){
      if(!r.saved){ r.saved = true; const list = klausuren(); list.unshift({id:Date.now() + '-' + Math.random().toString(36).slice(2,6), t:Date.now(), name:r.klausur.name, law:S.law, paras:r.klausur.paras, n:r.items.length, pts, mx, pc, note}); store.set('rt.klausur', list.slice(0, 200)); }
      saveMsg = 'Ergebnis in der Historie gespeichert (Statistik).';
    } else saveMsg = 'Nicht gespeichert: Die Klausur wurde nicht vollständig beantwortet.';
  }
  const by = {}; r.res.forEach(x => { const b = by[x.n] || (by[x.n] = {label:x.label, n:x.n, pts:0, max:0}); b.pts += x.pts; b.max += 4; });
  const weak = r.res.filter(x => x.pts < 4);
  const groups = groupsOf(S.data);
  const colorOf = n => { const gi = groups.findIndex(g => g.ps.some(p => p.n===n)); return '--c'+(((gi<0?0:gi)%5)+1); };
  const C = 2*Math.PI*58, off = C*(1-pc/100);
  $('#app').innerHTML = `<h1>${r.klausur ? esc(r.klausur.name) : 'Auswertung'}</h1><p class="mute" style="margin-top:2px">${r.res.length}${complete ? '' : ' von ' + r.items.length} Fragen beantwortet</p>
    <div class="ring"><svg width="160" height="160" viewBox="0 0 150 150" role="img" aria-label="${pc} Prozent"><circle cx="75" cy="75" r="58" fill="none" stroke="var(--line)" stroke-width="13"/><circle cx="75" cy="75" r="58" fill="none" stroke="var(--acc)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 75 75)"/><text x="75" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">${pc} %</text><text x="75" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="var(--mute)">${pts} von ${mx} Punkten</text></svg></div>
    <div class="score"><b>Note ${note}</b><span class="mute">${NOTEN[note-1]} · ${pts} von höchstens ${mx} Punkten</span></div>
    ${saveMsg ? `<p class="note" style="margin-top:4px">${esc(saveMsg)}</p>` : ''}
    <div class="sec"><span>Nach Paragraf</span></div><div class="card">${Object.values(by).map(b => { const q = Math.round(b.pts/b.max*100); return `<div class="row" style="--cc:var(${colorOf(b.n)})"><span class="t">${esc(b.label)}</span><div class="track"><i style="width:${q}%"></i></div><span class="v">${q} %</span></div>`; }).join('')}</div>`;
  setDock(`<div class="actbar"><button class="btn alt" data-act="home">Startseite</button><button class="btn" data-act="retry" ${weak.length?'':'disabled'}>${weak.length ? weak.length+' Fehler wiederholen' : 'Alles richtig'}</button></div>`);
  window.scrollTo(0,0);
  if(complete && r.items.length >= 5 && pts === mx && !r.egg){ r.egg = true; setTimeout(() => { if(S.view === 'result' && S.run === r && !S.sheet) openSheet({kind:'egg'}, '#sheet .btn'); }, 500); }
}

/* ================= Teilen ================= */
function baseUrl(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }
function shareUrl(){
  const sh = S.sheet, ns = sh && sh.withSel ? sh.paras.filter(Boolean) : [];
  return baseUrl() + (ns.length ? '#' + S.law + ':' + ns.join(',') : '');
}
function qrSvg(url){
  if(typeof qrcode !== 'function') return '';
  try{
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(); let d = '';
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) d += `M${x} ${y}h1v1h-1z`;
    return `<svg viewBox="-4 -4 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Link"><rect x="-4" y="-4" width="${n+8}" height="${n+8}" fill="#fff"/><path d="${d}" fill="#0b1530"/></svg>`;
  }catch(e){ return ''; }
}
function openSheet(sh, focusSel){
  S.sheet = sh; S._prev = document.activeElement; renderSheet(); setBg(true);
  setTimeout(() => { const b = $(focusSel || '#sheet .xbtn'); if(b) b.focus(); }, 30);
}
function openShare(paras, fixed){
  const sel = paras || order().filter(n => S.sel.has(n));
  openSheet({kind:'share', paras:sel, withSel:!!paras, fixed:!!fixed, qr:false, copied:false});
}
function renderSettings(root, sh){
  const rows = NOTEN.slice(0,4).map((n,i) => `<div class="grow"><span class="badge">${i+1}</span><span class="gn">${n}</span><span class="pct"><input type="text" inputmode="decimal" data-gi="${i}" value="${esc(sh.draft[i])}" aria-label="Note ${i+1} ab Prozent"> %</span></div>`).join('');
  root.innerHTML = `<div class="dim" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Einstellungen"><div class="in">
      <div class="grab"></div>
      <div class="sh"><div><h2>Einstellungen</h2><p>Notenschlüssel: Mindestprozent je Note</p></div><button class="xbtn" data-act="close-sheet" aria-label="Schließen">✕</button></div>
      <div class="card" style="margin-top:12px">${rows}<div class="grow"><span class="badge">5</span><span class="gn">Nicht genügend</span><span class="mute" id="g5">unter ${esc(sh.draft[3])} %</span></div></div>
      <p class="gerr" id="gerr" role="alert">${sh.err ? esc(sh.err) : ''}</p>
      <p class="mute" style="font-size:12.5px">Die Werte müssen von Note 1 bis Note 4 kleiner werden. Eine Änderung gilt für neue Ergebnisse, gespeicherte Klausuren behalten ihre Note.</p>
      <div class="stack2" style="margin-top:12px"><button class="btn" data-act="grades-save">Speichern</button><button class="btn alt" data-act="grades-reset">Standard wiederherstellen (${DEF_GRADES.map(fmtNum).join(' / ')} %)</button></div>
    </div></div>`;
}
function renderEgg(root){
  root.innerHTML = `<div class="dim" data-act="close-sheet"></div>
    <div class="dlg" role="dialog" aria-modal="true" aria-label="Glückwunsch"><div class="em" aria-hidden="true">🏆</div><h3>Beamter des Tages!</h3><p>Herzlichen Glückwunsch zu 100 Prozent. Hast du überhaupt Freizeit, oder lernst du nur?</p><button class="btn" data-act="close-sheet">Nur noch kurz …</button></div>`;
}
function renderRef(root, sh){
  const r = REFS[sh.i]; if(!r){ closeSheet(); return; }
  root.innerHTML = `<div class="dim clear" data-act="close-sheet"></div>
    <div class="pop" id="pop" role="dialog" aria-label="Verweis ${esc(r.match)}"><span class="ptag">${esc(r.gesetz || 'Verweis')}</span><h3>${esc(r.titel || r.match)}</h3><p>${esc(r.text)}</p>
      <div class="prow">${r.ris ? `<a href="${esc(r.ris)}" target="_blank" rel="noopener">Im RIS öffnen</a>` : '<span></span>'}<button class="sm" data-act="close-sheet">Schließen</button></div></div>`;
  const pop = $('#pop'), h = pop.offsetHeight, rc = sh.rect;
  let top = rc.bottom + 10; if(top + h > window.innerHeight - 12) top = Math.max(12, rc.top - h - 10);
  pop.style.top = top + 'px';
}
function setBg(on){ ['#app','#dock'].forEach(q => { const el = $(q); if(el){ on ? el.setAttribute('inert','') : el.removeAttribute('inert'); } }); }
function closeSheet(){ S.sheet = null; renderSheet(); setBg(false); const p = S._prev; S._prev = null; if(p && p.isConnected && p.focus) p.focus(); }
function renderSheet(){
  const sh = S.sheet, root = $('#sheet');
  if(!sh){ root.innerHTML = ''; return; }
  if(sh.kind === 'settings') return renderSettings(root, sh);
  if(sh.kind === 'egg') return renderEgg(root);
  if(sh.kind === 'ref') return renderRef(root, sh);
  const had = root.contains(document.activeElement) && document.activeElement.dataset ? document.activeElement.dataset.act : null;
  const url = shareUrl(), n = sh.paras.length;
  const qr = sh.qr ? qrSvg(url) : '';
  root.innerHTML = `<div class="dim" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Rechtstrainer teilen"><div class="in">
      <div class="grab"></div>
      <div class="sh"><div><h2>${sh.fixed ? 'Klausur teilen' : 'Rechtstrainer teilen'}</h2><p>${sh.fixed ? 'Der Link enthält die Paragrafen der Klausur. Dein Fortschritt wird nicht mitgeschickt.' : 'Andere öffnen den Link in Safari und nutzen die App.'}</p></div><button class="xbtn" data-act="close-sheet" aria-label="Schließen">✕</button></div>
      ${(!sh.fixed && n) ? `<label class="with" style="margin-top:12px"><input type="checkbox" data-act="with" ${sh.withSel?'checked':''}> Meine Paragrafenauswahl mitsenden (${n} §)</label>` : ''}
      <div class="linkrow"><input id="lnk" readonly value="${esc(url)}" aria-label="Link zur App"><button class="cp ${sh.copied?'done':''}" data-act="copy">${sh.copied?'Kopiert ✓':'Kopieren'}</button></div>
      <div class="stack2">
        <button class="btn" data-act="native">${IC.share}Link teilen …</button>
        <button class="btn soft" data-act="qr">${sh.qr?'QR-Code ausblenden':'QR-Code anzeigen'}</button>
      </div>
      ${sh.qr ? `<div class="qr">${qr || '<span>QR-Code konnte nicht erzeugt werden.</span>'}<span>Mit der Kamera scannen</span></div>` : ''}
      <div class="tip"><span aria-hidden="true">💡</span><div><b>Tipp für Empfänger:</b> In Safari öffnen, auf Teilen tippen und „Zum Home-Bildschirm“ wählen. Dann läuft die App wie eine normale App, auch offline. Klausuren und Fortschritt gelten nur dort, wo sie angelegt wurden (Safari oder Home-Bildschirm-App).</div></div>
    </div></div>`;
  if(had){ const el = root.querySelector('[data-act="' + had + '"]'); if(el) el.focus(); }
}
async function copyLink(){
  try{ await navigator.clipboard.writeText(shareUrl()); S.sheet.copied = true; renderSheet(); setTimeout(() => { if(S.sheet){ S.sheet.copied = false; renderSheet(); } }, 1800); }
  catch(e){ const i = $('#lnk'); if(i){ i.focus(); i.select(); } toast('Link markiert – bitte manuell kopieren'); }
}
async function nativeShare(){
  const data = {title:'Rechtstrainer', text:SHARE_TEXT, url:shareUrl()};
  if(navigator.share){ try{ await navigator.share(data); } catch(e){ /* abgebrochen */ } }
  else copyLink();
}
/* Link mit Paragrafenauswahl öffnen: …/lernapp/#BDG:4,10,43a */
function applyHash(initial){
  if(!location.hash || location.hash.length < 2) return false;
  let raw = ''; try{ raw = decodeURIComponent(location.hash.slice(1)); }catch(e){ raw = ''; }
  const m = /^([A-Za-z]+):\s*([0-9A-Za-z,\s]*?)\s*\/?$/.exec(raw.trim()); if(!m) return false;   // fremder Hash: ignorieren
  const law = LAWS.find(l => l.ready && l.id.toLowerCase() === m[1].toLowerCase());
  history.replaceState(null, '', location.pathname + location.search);
  if(!law || !S.data || law.id !== S.law){ toast('Dieser Link passt nicht zu dieser App.'); return false; }
  const valid = new Set(order()), ns = m[2].toLowerCase().split(',').map(x => x.trim()).filter(n => valid.has(n));
  if(!ns.length){ toast('Der Link enthält keine gültigen Paragrafen.'); return false; }
  if(S.view === 'quiz' && !initial && !confirm('Training abbrechen und die Auswahl aus dem Link übernehmen?')) return false;
  S.sel = new Set(ns); persistSel();
  groupsOf(S.data).forEach((g,gi) => { if(g.ps.some(p => S.sel.has(p.n))) S.open.add(gi); }); persistOpen();
  S.view = 'home'; closeSheetSilently();
  toast('Auswahl aus Link übernommen: ' + ns.length + ' Paragrafen');
  return true;
}
function closeSheetSilently(){ S.sheet = null; const r = $('#sheet'); if(r) r.innerHTML = ''; setBg(false); }

/* ================= Aktionen (Event-Delegation) ================= */
const ACT = {
  tab(b){ S.view = b.dataset.v; render(); },
  law(b){ /* weitere Gesetze folgen */ },
  grp(b){ const g = +b.dataset.g; S.open.has(g) ? S.open.delete(g) : S.open.add(g); persistOpen(); render(true); },
  grpall(b, e){ e.stopPropagation(); const g = groupsOf(S.data)[+b.dataset.g], all = g.ps.every(p => S.sel.has(p.n)); g.ps.forEach(p => all ? S.sel.delete(p.n) : S.sel.add(p.n)); persistSel(); render(true); },
  tog(b){ const n = b.dataset.p; S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); persistSel(); render(true); },
  all(){ S.sel = new Set(order()); persistSel(); render(true); },
  none(){ S.sel = new Set(); persistSel(); render(true); },
  start(){ startRun(buildPool()); },
  'stk-load'(b){ const s = stacks().find(x => x.id === b.dataset.id); if(!s) return; const valid = new Set(order()); S.sel = new Set(s.paras.filter(n => valid.has(n))); persistSel();
    groupsOf(S.data).forEach((g,gi) => { if(g.ps.some(p => S.sel.has(p.n))) S.open.add(gi); }); persistOpen(); S.view = 'home'; render(); toast('Klausur geladen'); },
  'stk-save'(){ saveStack(); },
  'stk-del'(b){ if(confirm('Klausur löschen?')){ store.set('rt.stacks', stacks().filter(x => x.id !== b.dataset.id)); render(true); } },
  'stk-share'(b){ const s = stacks().find(x => x.id === b.dataset.id); if(s) openShare(s.paras, true); },
  share(){ openShare(null, false); },
  settings(){ openSheet({kind:'settings', draft:grades().map(fmtNum), err:''}, '#sheet input'); },
  'grades-save'(){
    const sh = S.sheet; if(!sh || sh.kind !== 'settings') return;
    const v = sh.draft.map(x => Number(String(x).trim().replace(',', '.')));
    if(v.some(x => !isFinite(x) || x <= 0 || x > 100)){ sh.err = 'Bitte vier Zahlen zwischen 1 und 100 eingeben.'; renderSheet(); return; }
    if(!v.every((x,i) => i === 0 || x < v[i-1])){ sh.err = 'Die Werte müssen von Note 1 bis Note 4 kleiner werden.'; renderSheet(); return; }
    store.set('rt.grades', v); closeSheet(); render(true); toast('Notenschlüssel gespeichert');
  },
  'grades-reset'(){ store.set('rt.grades', DEF_GRADES.slice()); closeSheet(); render(true); toast('Standard-Notenschlüssel wiederhergestellt'); },
  ref(b){ const rc = b.getBoundingClientRect(); openSheet({kind:'ref', i:+b.dataset.r, rect:{top:rc.top, bottom:rc.bottom}}, '#sheet .sm'); },
  'stk-start'(b){
    const s = stacks().find(x => x.id === b.dataset.id); if(!s) return;
    const valid = new Set(order()), paras = s.paras.filter(n => valid.has(n)); if(!paras.length){ toast('Diese Klausur enthält keine passenden Paragrafen.'); return; }
    S.sel = new Set(paras); persistSel();
    const pool = []; S.data.paragrafen.forEach(p => { if(S.sel.has(p.n)) p.q.forEach(q => pool.push({q, p})); });
    startRun(pool, {id:s.id, name:s.name, paras});
  },
  'hist-all'(){ S.histAll = !S.histAll; render(true); },
  'hist-clear'(){ if(confirm('Gesamte Historie der Klausur-Ergebnisse löschen?')){ store.set('rt.klausur', []); render(true); toast('Historie gelöscht'); } },
  'close-sheet'(){ closeSheet(); },
  with(b){ S.sheet.withSel = b.checked; renderSheet(); },
  copy(){ copyLink(); },
  native(){ nativeShare(); },
  qr(){ S.sheet.qr = !S.sheet.qr; renderSheet(); },
  pick(b){ const r = S.run; if(r.checked) return; const i = +b.dataset.i; r.ticked.has(i) ? r.ticked.delete(i) : r.ticked.add(i); b.setAttribute('aria-pressed', r.ticked.has(i)); b.querySelector('.bx').textContent = r.ticked.has(i) ? '✓' : ''; },
  check(){ checkAnswer(); },
  next(){ const r = S.run; if(r.i+1 < r.items.length){ r.i++; r.ticked = new Set(); r.checked = false; render(); } else { S.view = 'result'; render(); } },
  quit(){ const r = S.run; if(!r.res.length){ S.view = 'home'; render(); } else if(confirm('Training beenden? Bisherige Ergebnisse werden angezeigt.')){ S.view = 'result'; render(); } },
  flag(b){ const q = S.run.items[S.run.i].q; let f = flags(); f = f.includes(q.id) ? f.filter(x => x !== q.id) : f.concat(q.id); store.set('rt.flags', f); b.setAttribute('aria-pressed', f.includes(q.id)); toast(f.includes(q.id) ? 'Frage markiert' : 'Markierung entfernt'); },
  home(){ S.view = 'home'; render(); },
  retry(){ const ids = new Set(S.run.res.filter(x => x.pts < 4).map(x => x.id)); const pool = []; S.data.paragrafen.forEach(p => p.q.forEach(q => { if(ids.has(q.id)) pool.push({q, p}); })); startRun(pool); },
  flags(){ const txt = 'Gemeldete Fragen (Rechtstrainer): ' + flags().join(', '); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Kopiert'), () => prompt('Bitte kopieren:', txt)); },
  reset(){ if(confirm('Gesamten Lernfortschritt auf diesem Gerät löschen?')){ store.set('rt.hist2', {}); render(true); toast('Fortschritt zurückgesetzt'); } }
};
let last = {act:'', t:-1000};
const NAV = ['check','next','start','retry','quit','stk-save','stk-load','stk-start','home'];
const SWAP = {check:'next', next:'check'};   // der zweite Tipp eines Doppeltipps trifft sonst den neuen Knopf an derselben Stelle
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(NAV.includes(a)){ const t = performance.now(); if(t - last.t < 450 && (a === last.act || SWAP[last.act] === a)) return; last = {act:a, t}; }
  const f = ACT[b.dataset.act]; if(f){ f(b, e); }
});
document.addEventListener('input', e => {
  const t = e.target, sh = S.sheet;
  if(sh && sh.kind === 'settings' && t.dataset && t.dataset.gi !== undefined){ sh.draft[+t.dataset.gi] = t.value; const g = $('#g5'); if(g) g.textContent = 'unter ' + (sh.draft[3] || '…') + ' %'; }
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('ref')){ e.preventDefault(); e.target.click(); return; }
  if(e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.gi !== undefined){ e.preventDefault(); ACT['grades-save'](); return; }
  if(e.key === 'Escape' && S.sheet){ closeSheet(); return; }
  if(e.key === 'Tab' && S.sheet){
    const f = [...document.querySelectorAll('#sheet button, #sheet input, #sheet a')].filter(x => !x.disabled); if(!f.length) return;
    const first = f[0], last = f[f.length-1], inside = $('#sheet').contains(document.activeElement);
    if(!inside || (e.shiftKey && document.activeElement === first)){ e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  if(e.key === 'Enter' && e.target && e.target.id === 'sname'){ e.preventDefault(); ACT['stk-save'](); }
});
window.addEventListener('hashchange', () => { if(S.data && applyHash(false)) render(); });

/* ================= Start ================= */
(async function boot(){
  try{ S.data = await loadLaw(S.law); await loadRefs(); }
  catch(e){ $('#app').innerHTML = '<h1>Rechtstrainer</h1><p class="mute">Daten konnten nicht geladen werden. Bitte Verbindung prüfen und neu öffnen.</p>'; return; }
  const valid = new Set(order());
  S.sel = new Set(store.get('rt.sel.'+S.law, []).filter(n => valid.has(n)));
  S.open = new Set(store.get('rt.open.'+S.law, []));
  applyHash(true);
  render();
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
