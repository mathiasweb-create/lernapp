<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechtstrainer</title>
<meta name="description" content="Multiple-Choice-Training für Gesetzestexte">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechtstrainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#14181d; --mute:#5d6672; --line:#dfe3e8;
  --acc:#1d4ed8; --acc-ink:#ffffff; --acc-soft:#e8eefc;
  --ok:#157347; --ok-bg:#e6f4ec; --bad:#b42318; --bad-bg:#fdecea; --warn:#8a5200; --warn-bg:#fff4e0;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214; --card:#1a1e23; --ink:#eceff3; --mute:#9aa4b1; --line:#2b323a;
    --acc:#7aa2ff; --acc-ink:#0b1020; --acc-soft:#1c2740;
    --ok:#4cc38a; --ok-bg:#12281f; --bad:#ff7b72; --bad-bg:#2f1715; --warn:#f0b35a; --warn-bg:#2b2111;
  }
}
:root[data-theme="dark"]{
  --bg:#101214; --card:#1a1e23; --ink:#eceff3; --mute:#9aa4b1; --line:#2b323a;
  --acc:#7aa2ff; --acc-ink:#0b1020; --acc-soft:#1c2740;
  --ok:#4cc38a; --ok-bg:#12281f; --bad:#ff7b72; --bad-bg:#2f1715; --warn:#f0b35a; --warn-bg:#2b2111;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:26px 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:6px 12px;font-size:14px;font-weight:600;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tab[disabled]{opacity:.5}
.tab small{font-weight:500;opacity:.8;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-weight:650;line-height:1.2}
.chip small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chip[aria-pressed="true"] small{color:var(--acc)}
.stack{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stack:first-child{border-top:0}
.stack b{display:block}
.stack span{color:var(--mute);font-size:13px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.opt{display:flex;gap:10px;align-items:center;padding:6px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;padding:14px}
.note{color:var(--mute);font-size:13px;margin-top:22px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;gap:8px}
.q-title{font-size:15px;color:var(--mute);margin:4px 0 12px}
.opt-card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.opt-card .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1}
.opt-card[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt-card[aria-pressed="true"] .box{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt-card .txt{flex:1}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:8px}
.opt-card.ok{border-color:var(--ok);background:var(--ok-bg)} .opt-card.ok .box{background:var(--ok);border-color:var(--ok);color:#fff} .opt-card.ok .tag{background:var(--ok);color:#fff}
.opt-card.bad{border-color:var(--bad);background:var(--bad-bg)} .opt-card.bad .box{background:var(--bad);border-color:var(--bad);color:#fff} .opt-card.bad .tag{background:var(--bad);color:#fff}
.opt-card.miss{border-color:var(--warn);background:var(--warn-bg)} .opt-card.miss .tag{background:var(--warn);color:#fff}
.opt-card.neutral{opacity:.8}
.opt-card.neutral .tag{background:var(--line);color:var(--mute)}
.fix{display:block;margin-top:6px;font-size:14px;color:var(--mute)}
.score{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.score b{font-size:30px;letter-spacing:-.02em}
details{margin-top:6px}
summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
pre.law{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-serif,Georgia,serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:750;letter-spacing:-.03em;margin:4px 0}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.empty{color:var(--mute);padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- Gesetze ---------- */
const LAWS = [
  {id:'BDG',  name:'BDG',  full:'Beamten-Dienstrechtsgesetz 1979', file:'daten/bdg.json', ready:true},
  {id:'StGB', name:'StGB', full:'Strafgesetzbuch',                  ready:false},
  {id:'SPG',  name:'SPG',  full:'Sicherheitspolizeigesetz',         ready:false},
  {id:'VStG', name:'VStG', full:'Verwaltungsstrafgesetz',           ready:false}
];
const cache = {};
async function loadLaw(id){
  if(cache[id]) return cache[id];
  const law = LAWS.find(l => l.id === id);
  const r = await fetch(law.file);
  if(!r.ok) throw new Error('Daten nicht ladbar');
  cache[id] = await r.json();
  return cache[id];
}

/* ---------- Zustand ---------- */
const S = {
  view:'home', law:store.get('rt.law','BDG'), sel:new Set(), onlyOpen:store.get('rt.onlyOpen',false),
  run:null, data:null
};
const hist  = () => store.get('rt.hist', {});
const stacks= () => store.get('rt.stacks', []);
const flags = () => store.get('rt.flags', []);

function maxPoints(q){ const t=q.s.filter(x=>x.w).length; return Math.max(t,1); }
function score(q, ticked){            // ticked: Set von Indizes in q.s
  const trueCount = q.s.filter(x=>x.w).length;
  let right=0, wrong=0;
  q.s.forEach((x,i)=>{ if(ticked.has(i)){ x.w ? right++ : wrong++; } });
  if(trueCount === 0) return ticked.size === 0 ? 1 : 0;   // nichts richtig: nichts ankreuzen = 1 Punkt
  return Math.max(0, right - wrong);
}
function isOpen(q){ const h=hist()[q.id]; return !h || h.last < h.max; }

/* ---------- Home ---------- */
async function renderHome(){
  S.view='home';
  const app = $('#app');
  const law = LAWS.find(l=>l.id===S.law);
  let tabs = '<div class="tabs" role="tablist">' + LAWS.map(l =>
    `<button class="tab" role="tab" aria-selected="${l.id===S.law}" data-law="${l.id}" ${l.ready?'':'disabled'}>${l.name}${l.ready?'':'<small>bald</small>'}</button>`).join('') + '</div>';
  let body = '';
  if(law.ready){
    try{ S.data = await loadLaw(law.id); }catch(e){ app.innerHTML = '<h1>Rechtstrainer</h1><p class="sub">Daten konnten nicht geladen werden. Bitte Verbindung prüfen.</p>'; return; }
    const stored = store.get('rt.sel.'+law.id, null);
    if(stored && !S._selLoaded){ S.sel = new Set(stored); }
    S._selLoaded = true;
    const valid = new Set(S.data.paragrafen.map(p=>p.n));
    S.sel = new Set([...S.sel].filter(n=>valid.has(n)));
    const h = hist();
    const total = S.data.paragrafen.reduce((a,p)=>a+p.q.length,0);
    const done  = S.data.paragrafen.reduce((a,p)=>a+p.q.filter(q=>h[q.id]&&h[q.id].last>=h[q.id].max).length,0);
    body += `<p class="sub">${esc(law.full)} · ${total} Fragen · ${done} sicher beantwortet</p>`;
    body += `<h2>Paragrafen wählen</h2>
      <div class="row" style="margin-bottom:10px"><button class="btn sm" id="all">Alle</button><button class="btn sm" id="none">Keine</button><span class="sp"></span><span class="sub" style="margin:0;font-size:13px" id="cnt"></span></div>
      <div class="grid">` + S.data.paragrafen.map(p =>
        `<button class="chip" data-p="${p.n}" aria-pressed="${S.sel.has(p.n)}">${esc(p.label)}<small>${p.q.length} Fragen</small></button>`).join('') + '</div>';
    body += `<h2>Optionen</h2><div class="card"><label class="opt"><input type="checkbox" id="onlyOpen" ${S.onlyOpen?'checked':''}> Nur Fragen, die ich noch nicht sicher kann</label></div>`;
    body += `<h2>Prüfungs-Stacks</h2><div class="card" id="stacks"></div>`;
    const fl = flags();
    if(fl.length) body += `<div class="row" style="margin-top:14px"><button class="btn sm ghost" id="expflags">${fl.length} gemeldete Frage(n) kopieren</button></div>`;
    body += `<p class="note">Quelle der Gesetzestexte: ${esc(S.data.quelle)}, abgerufen am ${esc(S.data.abgerufen)}. Fragen wurden von einer KI aus dem Wortlaut erstellt und können Fehler enthalten – im Zweifel gilt der Gesetzestext (wird nach jeder Antwort angezeigt). Keine Rechtsberatung.</p>`;
  } else {
    body = `<p class="sub">${esc(law.full)}</p><div class="card"><b>In Vorbereitung</b><p class="sub" style="margin:6px 0 0">Dieses Gesetz wird als Nächstes ergänzt.</p></div>`;
  }
  app.innerHTML = `<h1>Rechtstrainer</h1>${tabs}<div style="height:12px"></div>${body}
    <div class="bar"><div class="in"><button class="btn pri" id="start" disabled>Start</button></div></div>`;
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.law=b.dataset.law; S._selLoaded=false; S.sel=new Set(); store.set('rt.law',S.law); renderHome(); });
  if(!law.ready) return;
  const refresh = () => {
    app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', S.sel.has(c.dataset.p)));
    store.set('rt.sel.'+law.id, [...S.sel]);
    const qs = buildPool();
    $('#cnt').textContent = S.sel.size + ' § gewählt';
    const st = $('#start'); st.disabled = qs.length===0;
    st.textContent = qs.length ? `Start · ${qs.length} Fragen` : (S.sel.size ? 'Keine offenen Fragen' : 'Paragrafen wählen');
    renderStacks();
  };
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => { const n=c.dataset.p; S.sel.has(n)?S.sel.delete(n):S.sel.add(n); refresh(); });
  $('#all').onclick  = () => { S.sel = new Set(S.data.paragrafen.map(p=>p.n)); refresh(); };
  $('#none').onclick = () => { S.sel = new Set(); refresh(); };
  $('#onlyOpen').onchange = e => { S.onlyOpen = e.target.checked; store.set('rt.onlyOpen',S.onlyOpen); refresh(); };
  $('#start').onclick = () => startRun(buildPool());
  const ef = $('#expflags'); if(ef) ef.onclick = exportFlags;
  refresh();
}
function buildPool(){
  let qs = [];
  S.data.paragrafen.forEach(p => { if(S.sel.has(p.n)) p.q.forEach(q => qs.push({q, p})); });
  if(S.onlyOpen) qs = qs.filter(x => isOpen(x.q));
  return qs;
}
function renderStacks(){
  const box = $('#stacks'); if(!box) return;
  const list = stacks().filter(s => s.law === S.law);
  let h = list.length ? list.map(s => `<div class="stack"><div class="sp"><b>${esc(s.name)}</b><span>${s.paras.map(n=>'§ '+n).join(', ')}</span></div>
      <button class="btn sm" data-load="${s.id}">Laden</button><button class="btn sm danger" data-del="${s.id}" aria-label="Stack löschen">✕</button></div>`).join('')
    : '<div class="empty">Noch keine Stacks gespeichert.</div>';
  h += `<div class="row" style="margin-top:12px"><input type="text" id="sname" placeholder="Name, z. B. Dienstpflichten" maxlength="40"><button class="btn sm" id="ssave" ${S.sel.size?'':'disabled'}>Speichern</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const s=stacks().find(x=>x.id===b.dataset.load); if(s){ S.sel=new Set(s.paras); store.set('rt.sel.'+S.law,[...S.sel]); renderHome(); toast('Stack geladen'); } });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if(confirm('Stack löschen?')){ store.set('rt.stacks', stacks().filter(x=>x.id!==b.dataset.del)); renderStacks(); } });
  const sv = $('#ssave'); if(sv) sv.onclick = () => {
    const name = ($('#sname').value||'').trim() || ('Stack ' + (list.length+1));
    const all = stacks(); all.push({id:String(Date.now()), name, law:S.law, paras:[...S.sel]});
    store.set('rt.stacks', all); renderStacks(); toast('Stack gespeichert');
  };
}
function exportFlags(){
  const txt = 'Gemeldete Fragen (Rechtstrainer): ' + flags().join(', ');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Kopiert'), ()=>prompt('Bitte kopieren:', txt));
}

/* ---------- Quiz ---------- */
function startRun(pool){
  if(!pool.length) return;
  S.run = {items: shuffle(pool).map(x => ({q:x.q, p:x.p, order:shuffle([0,1,2,3])})), i:0, ticked:new Set(), checked:false, res:[]};
  renderQ();
}
function renderQ(){
  S.view='quiz';
  const r = S.run, it = r.items[r.i], q = it.q;
  const total = r.items.length;
  const pts = r.res.reduce((a,x)=>a+x.pts,0), mx = r.res.reduce((a,x)=>a+x.max,0);
  const fl = flags().includes(q.id);
  let h = `<div class="meta"><span>Frage ${r.i+1} / ${total} · ${esc(it.p.label)}</span><span>${pts} / ${mx} Punkte</span></div>
    <div class="progress"><i style="width:${(r.i + (r.checked?1:0))/total*100}%"></i></div>
    <div class="q-title">Welche Aussagen sind richtig? (${esc(it.p.label)} BDG – ${esc(it.p.title)})</div>`;
  const ticked = r.ticked;
  it.order.forEach((idx, pos) => {
    const s = q.s[idx];
    let cls = '', tag = '', mark = '';
    if(r.checked){
      const t = ticked.has(idx);
      if(t && s.w){ cls='ok'; tag='Richtig – zu Recht angekreuzt'; mark='✓'; }
      else if(t && !s.w){ cls='bad'; tag='Falsch – Abzug'; mark='✕'; }
      else if(!t && s.w){ cls='miss'; tag='Richtig – nicht angekreuzt'; mark=''; }
      else { cls='neutral'; tag='Falsch – zu Recht nicht angekreuzt'; mark=''; }
    } else if(ticked.has(idx)) mark='✓';
    h += `<button class="opt-card ${cls}" data-i="${idx}" aria-pressed="${ticked.has(idx)}" ${r.checked?'disabled':''}>
      <span class="box">${mark}</span>
      <span class="txt">${esc(s.t)}${r.checked?`<br><span class="tag">${tag}</span>${(!s.w&&s.k)?`<span class="fix">→ ${esc(s.k)}</span>`:''}`:''}</span></button>`;
  });
  if(r.checked){
    const last = r.res[r.res.length-1];
    const nTrue = q.s.filter(x=>x.w).length;
    h += `<div class="score"><b>${last.pts} / ${last.max}</b><span class="sub" style="margin:0">Punkt${last.max===1?'':'e'}${nTrue===0?' · keine Aussage war richtig':''}</span></div>
      <details open><summary>Gesetzestext ${esc(it.p.label)} BDG · ${esc(q.ref)}</summary><pre class="law">${esc(it.p.title)}\n\n${esc(it.p.text)}</pre>
      <div class="note" style="margin-top:8px">Fassung in Kraft seit ${esc(it.p.stand)} · Quelle: RIS</div></details>
      <div class="row" style="margin-top:10px"><button class="btn sm flag" id="flag" aria-pressed="${fl}">⚑ Frage melden</button></div>`;
  }
  h += `<div class="bar"><div class="in">${r.checked
      ? `<button class="btn pri" id="next">${r.i+1<total?'Weiter':'Auswertung'}</button>`
      : `<button class="btn" id="quit">Beenden</button><button class="btn pri" id="check">Prüfen</button>`}</div></div>`;
  $('#app').innerHTML = h;
  window.scrollTo(0,0);
  document.querySelectorAll('.opt-card').forEach(b => b.onclick = () => {
    if(r.checked) return; const i=+b.dataset.i; ticked.has(i)?ticked.delete(i):ticked.add(i);
    b.setAttribute('aria-pressed', ticked.has(i)); b.querySelector('.box').textContent = ticked.has(i)?'✓':'';
  });
  const c = $('#check'); if(c) c.onclick = () => {
    const p = score(q, ticked), m = maxPoints(q);
    r.res.push({id:q.id, n:it.p.n, label:it.p.label, pts:p, max:m});
    const H = hist(); const o = H[q.id] || {n:0}; H[q.id] = {last:p, max:m, n:o.n+1}; store.set('rt.hist', H);
    r.checked = true; renderQ();
  };
  const nx = $('#next'); if(nx) nx.onclick = () => { if(r.i+1<total){ r.i++; r.ticked=new Set(); r.checked=false; renderQ(); } else renderResult(); };
  const qt = $('#quit'); if(qt) qt.onclick = () => { if(!r.res.length || confirm('Training beenden? Bisherige Ergebnisse werden angezeigt.')) { r.res.length ? renderResult() : renderHome(); } };
  const fg = $('#flag'); if(fg) fg.onclick = () => {
    let f = flags(); f = f.includes(q.id) ? f.filter(x=>x!==q.id) : f.concat(q.id); store.set('rt.flags', f);
    fg.setAttribute('aria-pressed', f.includes(q.id)); toast(f.includes(q.id)?'Frage markiert':'Markierung entfernt');
  };
}

/* ---------- Auswertung ---------- */
function renderResult(){
  S.view='result';
  const r = S.run;
  const pts = r.res.reduce((a,x)=>a+x.pts,0), mx = r.res.reduce((a,x)=>a+x.max,0);
  const pct = mx ? Math.round(pts/mx*100) : 0;
  const by = {};
  r.res.forEach(x => { const b = by[x.n] || (by[x.n] = {label:x.label, pts:0, max:0, n:0}); b.pts+=x.pts; b.max+=x.max; b.n++; });
  const weak = r.res.filter(x => x.pts < x.max);
  let h = `<h1>Auswertung</h1><p class="sub">${r.res.length} Fragen beantwortet</p>
    <div class="card"><div class="big">${pct} %</div><div class="sub" style="margin:0">${pts} von ${mx} Punkten</div></div>
    <h2>Nach Paragraf</h2><div class="card"><table><tr><th>§</th><th class="n">Fragen</th><th class="n">Punkte</th><th class="n">Quote</th></tr>` +
    Object.values(by).map(b => `<tr><td>${esc(b.label)}</td><td class="n">${b.n}</td><td class="n">${b.pts}/${b.max}</td><td class="n">${b.max?Math.round(b.pts/b.max*100):0} %</td></tr>`).join('') + `</table></div>
    <div class="bar"><div class="in"><button class="btn" id="home">Startseite</button>
    <button class="btn pri" id="retry" ${weak.length?'':'disabled'}>${weak.length?`${weak.length} Fehler wiederholen`:'Alles richtig'}</button></div></div>`;
  $('#app').innerHTML = h; window.scrollTo(0,0);
  $('#home').onclick = () => renderHome();
  $('#retry').onclick = () => {
    const ids = new Set(weak.map(x=>x.id));
    const pool = []; S.data.paragrafen.forEach(p => p.q.forEach(q => { if(ids.has(q.id)) pool.push({q,p}); }));
    startRun(pool);
  };
}

/* ---------- Start ---------- */
renderHome();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
